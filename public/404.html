<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>LIMINAL: Вход в ноосферу</title>
    <script>
      // GitHub Pages 404 redirect для SPA
      // Просто редиректим на index.html - роутер сам разберется с путем
      var l = window.location;
      var basePath = '/land_plf';
      
      // Проверяем, находимся ли мы на GitHub Pages
      if (l.hostname === 'safal207.github.io' || l.pathname.startsWith('/land_plf')) {
        // Редиректим на index.html с сохранением полного пути
        var redirectUrl = l.origin + basePath + '/index.html';
        // Сохраняем оригинальный путь и query параметры
        var originalPath = l.pathname + (l.search ? l.search : '') + (l.hash ? l.hash : '');
        // Сохраняем в sessionStorage для восстановления роутером
        sessionStorage.setItem('redirectPath', originalPath);
        window.location.replace(redirectUrl);
      } else {
        // Локальная разработка
        var originalPath = l.pathname + (l.search ? l.search : '') + (l.hash ? l.hash : '');
        sessionStorage.setItem('redirectPath', originalPath);
        window.location.replace(l.origin + '/index.html');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/land_plf/src/main.tsx"></script>
  </body>
</html>
