<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>LIMINAL: Вход в ноосферу</title>
    <script>
      // GitHub Pages 404 redirect для SPA
      // Редиректим на index.html с сохранением пути через hash
      var l = window.location;
      var basePath = '/land_plf';
      
      // Проверяем, находимся ли мы на GitHub Pages
      if (l.hostname === 'safal207.github.io' || l.pathname.startsWith('/land_plf')) {
        // Сохраняем текущий путь для роутера
        var currentPath = l.pathname.replace(basePath, '') || '/';
        var redirectUrl = l.origin + basePath + '/index.html';
        
        // Если это не корневой путь и не index.html, добавляем его как hash
        if (currentPath !== '/' && currentPath !== '/index.html') {
          redirectUrl += '#' + currentPath;
        }
        
        // Сохраняем query параметры
        if (l.search) {
          redirectUrl += (redirectUrl.includes('#') ? '&' : '#') + l.search.slice(1);
        }
        
        window.location.replace(redirectUrl);
      } else {
        // Локальная разработка
        var localPath = l.pathname || '/';
        var localRedirect = l.origin + '/index.html';
        if (localPath !== '/' && localPath !== '/index.html') {
          localRedirect += '#' + localPath;
        }
        if (l.search) {
          localRedirect += (localRedirect.includes('#') ? '&' : '#') + l.search.slice(1);
        }
        window.location.replace(localRedirect);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/land_plf/src/main.tsx"></script>
  </body>
</html>
